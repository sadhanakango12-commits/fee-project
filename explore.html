<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISWAP - Categories</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
background-size:400% 400%;
animation:move 10s infinite ease;
}

/* BACKGROUND ANIMATION */
@keyframes move{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 60px;
background:white;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.logo{
font-size:24px;
font-family:'Orbitron',sans-serif;
color:#111;
letter-spacing:2px;
}

/* TITLE */

.title{
text-align:center;
margin-top:40px;
font-size:34px;
font-family:'Orbitron',sans-serif;
background:linear-gradient(90deg,#00c6ff,#a100ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* CONTAINER */

.container{
display:flex;
justify-content:center;
align-items:center;
gap:50px;
padding:70px 20px;
flex-wrap:wrap;
}

/* CARD */

.card{
width:300px;
height:400px;
border-radius:25px;
overflow:hidden;
position:relative;
cursor:pointer;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
transition:0.5s;
}

/* IMAGE */

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

/* OVERLAY */

.overlay{
position:absolute;
bottom:0;
width:100%;
padding:25px;
background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
color:white;
backdrop-filter:blur(5px);
}

/* TEXT */

.overlay h2{
font-family:'Orbitron',sans-serif;
font-size:22px;
margin-bottom:5px;
}

.overlay p{
font-size:14px;
opacity:0.8;
}

/* HOVER */

.card:hover{
transform:translateY(-12px) scale(1.06);
}

.card:hover img{
transform:scale(1.1);
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div class="logo">UNISWAP</div>
</div><!-- CARDS -->
<div class="container">

<a href="men.html" class="card" style="display:block; text-decoration:none; color:inherit;">
<img src="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=800&q=80">
<div class="overlay">
<h2>MEN</h2>
<p>Explore Men's Collection</p>
</div>
</a>

<a href="women.html" class="card" style="display:block; text-decoration:none; color:inherit;">
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=800&q=80">
<div class="overlay">
<h2>WOMEN</h2>
<p>Explore Women's Collection</p>
</div>
</a>

</div>

<script src="wishlist.js"></script>

    <script src="cursor.js"></script>

    <script src="search.js"></script>
</body>
</html>
