<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN | Premium Marketplace</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            color: #0f172a;
            padding-top: 120px;
        }

        /* NAVBAR */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #2563eb, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            position: relative;
            font-weight: 500;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: #2563eb;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a.active {
            color: #2563eb;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            width: 300px;
        }

        .search-box input {
            border: none;
            padding: 10px 18px;
            outline: none;
            width: 100%;
            color: #334155;
        }

        .search-box button {
            border: none;
            background: transparent;
            color: #64748b;
            padding: 10px 18px;
            cursor: pointer;
        }

        .nav-right {
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }

        .login-btn {
            padding: 10px 24px;
            border: 2px solid #e2e8f0;
            background: white;
            color: #0f172a;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .login-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .sell-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: 0.3s;
        }

        .sell-btn:hover {
            transform: translateY(-2px);
        }

        .cart-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            background: #f1f5f9;
            cursor: pointer;
            font-weight: 600;
            position: relative;
        }

        .cart-btn:hover {
            background: #e2e8f0;
        }

        /* CART DROPDOWN */
        .cart-dropdown {
            position: absolute;
            top: 65px;
            right: 0;
            width: 340px;
            max-height: 420px;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            padding: 15px;
            display: none;
            z-index: 9999;
        }

        .cart-dropdown.active {
            display: block;
        }

        .cart-dropdown h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            position: relative;
        }

        .cart-item:hover {
            background: #f8fafc;
        }

        .cart-item img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .cart-item-info p {
            font-size: 0.85rem;
            color: #64748b;
        }

        .remove-cart {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .remove-cart:hover {
            background: #fecaca;
            transform: scale(1.1);
        }

        .empty-cart {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
        }

        /* PAGE CONTENT (UNCHANGED) */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .header-bar a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .header-bar a:hover {
            color: #1d4ed8;
            transform: translateX(-5px);
        }

        .page-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 50px;
            background: linear-gradient(90deg, #2563eb, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .category-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .category-box {
            position: relative;
            height: 220px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
            background: #fff;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .category-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 0.6s ease;
            filter: brightness(0.7) contrast(1.1);
        }

        .category-box:hover::after {
            transform: scale(1.08);
            filter: brightness(0.6) blur(2px);
        }

        .category-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.2) 100%);
            z-index: 1;
        }

        .category-box span {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .category-box:hover span {
            transform: translateY(0);
        }

        .category-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(37,99,235,0.2);
            border-color: #2563eb;
        }

        .shirts::after { background-image: url("https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&q=80"); }
        .shoes::after { background-image: url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80"); }
        .watches::after { background-image: url("https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80"); }

        .category-box:nth-child(even)::after { background-color: #3b82f6; }
        .category-box:nth-child(odd)::after { background-color: #ec4899; }
    </style>
</head>
<body>

    <!-- FIXED NAVBAR -->
    <header>
        <a href="home_page.html" class="logo">UNISWAP</a>

        <div class="nav-links">
            <a href="home_page.html">Home</a>
            <a href="category.html" class="active">Categories</a>
            <a href="contact.html">Contact Us</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search premium items...">
            <button><i class="fas fa-search"></i></button>
        </div>

        <div class="nav-right">
            <a href="login.html"><button class="login-btn">Sign In</button></a>
            <a href="add.html"><button class="sell-btn"><i class="fas fa-plus"></i> Post Item</button></a>

            <button class="cart-btn" onclick="toggleCart(event)">
                <i class="fas fa-shopping-cart"></i>
                Cart (<span id="cart-count">0</span>)
            </button>

            <div class="cart-dropdown" id="cart-dropdown">
                <h3>Your Cart</h3>
                <div id="cart-items"></div>
            </div>
        </div>
    </header>

    <!-- ORIGINAL PAGE CONTENT -->
  
    <h1 class="page-title">MEN</h1>

    <div class="category-container">

        <a href="shirt.html" class="category-box shirts">
            <span>Shirts</span>
        </a>

        <a href="shoes.html" class="category-box shoes">
            <span>Shoes</span>
        </a>

        <a href="watch.html" class="category-box watches">
            <span>Watches</span>
        </a>

    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function removeFromCart(index, event) {
            event.stopPropagation();
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById("cart-count").innerText = cart.length;
            const cartItems = document.getElementById("cart-items");

            if (cart.length === 0) {
                cartItems.innerHTML = `<div class="empty-cart">Your cart is empty</div>`;
                return;
            }

            cartItems.innerHTML = cart.map((item, index) => `
                <div class="cart-item" onclick="window.location.href='${item.link}'">
                    <img src="${item.image}">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>${item.price}</p>
                    </div>
                    <button class="remove-cart" onclick="removeFromCart(${index}, event)">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function toggleCart(event) {
            event.stopPropagation();
            document.getElementById("cart-dropdown").classList.toggle("active");
        }

        document.addEventListener("click", function(e) {
            const cartDropdown = document.getElementById("cart-dropdown");
            const cartBtn = document.querySelector(".cart-btn");

            if (!cartDropdown.contains(e.target) && !cartBtn.contains(e.target)) {
                cartDropdown.classList.remove("active");
            }
        });

        updateCartUI();
    </script>

<script src="wishlist.js"></script>

    <script src="cursor.js"></script>

    <script src="search.js"></script>
</body>
</html>
