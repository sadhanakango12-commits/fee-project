<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Oversized Tee | Premium Wear</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #ec4899;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-main);
        }

        .product-container {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0,0,0,0.05);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .product-container {
                flex-direction: row;
            }
        }

        .product-container:hover {
            transform: translateY(-5px);
        }

        .product-image {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            min-height: 300px;
        }

        .product-image:hover img {
            transform: scale(1.05);
        }

        .tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--secondary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(236, 72, 153, 0.3);
            z-index: 10;
        }

        .product-info {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-info h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #0f172a, #334155);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subheading {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fbbf24;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .rating span {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .price-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .price-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
            z-index: 1;
        }

        .price-card:nth-child(2)::before {
            background: var(--secondary);
        }

        .price-card:hover {
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        .price-card:hover::before {
            width: 6px;
        }

        .price-card-content {
            position: relative;
            z-index: 2;
            padding-left: 10px;
        }

        .price-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .price small {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 2.5rem;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 2px solid #e2e8f0;
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            background: #f1f5f9;
        }

        .seller-details {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e2e8f0;
        }

        .seller-details h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .seller-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-value i {
            color: var(--primary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="product-container">
        <div class="product-image">
            <span class="tag">Premium</span>
            <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38" alt="Black Oversized Tee">
        </div>

        <div class="product-info">
            <h1>Black Oversized Tee</h1>
            
            <p class="subheading">
                Trendy oversized t-shirt perfect for casual and street fashion.
            </p>

            <div class="rating">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star-half-alt"></i>
                <span>4.5 (128 reviews)</span>
            </div>

            <div class="price-box">
                <div class="price-card">
                    <div class="price-card-content">
                        <h3>Purchase Price</h3>
                        <div class="price">₹399</div>
                    </div>
                </div>

                <div class="price-card">
                    <div class="price-card-content">
                        <h3>Rental Price</h3>
                        <div class="price">₹99 / day <small>/ day</small></div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary"><i class="fas fa-shopping-bag"></i> Buy Now</button>
                <button class="btn btn-outline"><i class="fas fa-calendar-alt"></i> Rent Item</button>
            </div>

            <div class="seller-details">
                <h3><i class="fas fa-store"></i> Seller Information</h3>
                <div class="seller-grid">
                    <div class="detail-item">
                        <span class="detail-label">Seller</span>
                        <span class="detail-value"><i class="fas fa-user-circle"></i> XYZ</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Availability</span>
                        <span class="detail-value"><i class="fas fa-box"></i> 12 pieces</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Rating</span>
                        <span class="detail-value"><i class="fas fa-star" style="color:#fbbf24"></i> 4.5 / 5.0</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Location (Hostel)</span>
                        <span class="detail-value"><i class="fas fa-map-marker-alt"></i> ABC</span>
                    </div>
                    <div class="detail-item" style="grid-column: 1 / -1;">
                        <span class="detail-label">Contact Email</span>
                        <span class="detail-value"><i class="fas fa-envelope"></i> contact@example.com</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="wishlist.js"></script>

    <script src="cursor.js"></script>

    <script src="search.js"></script>
</body>
</html>
