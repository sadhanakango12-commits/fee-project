<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniswap - Footwear</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f4f7fb;
  color:#0f172a;
  padding-top:100px;
  min-height:100vh;
}

/* ================= NAVBAR ================= */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 5%;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(15px);
  box-shadow:0 4px 30px rgba(0,0,0,0.05);
  border-bottom:1px solid rgba(255,255,255,0.5);
}

.logo{
  font-size:28px;
  font-weight:700;
  background:linear-gradient(90deg,#2563eb,#ec4899);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-decoration:none;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  text-decoration:none;
  color:#475569;
  position:relative;
  font-weight:500;
  font-size:1.05rem;
  transition:color 0.3s;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0%;
  height:2px;
  background:#2563eb;
  transition:width 0.3s ease;
}

.nav-links a:hover{
  color:#2563eb;
}

.nav-links a:hover::after,
.nav-links a.active::after{
  width:100%;
}

.nav-links a.active{
  color:#2563eb;
  font-weight:600;
}

.search-box{
  display:flex;
  background:white;
  border-radius:30px;
  overflow:hidden;
  border:1px solid #e2e8f0;
  width:300px;
}

.search-box input{
  border:none;
  padding:10px 18px;
  outline:none;
  width:100%;
  color:#334155;
}

.search-box button{
  border:none;
  background:transparent;
  color:#64748b;
  padding:10px 18px;
  cursor:pointer;
}

.nav-right{
  display:flex;
  gap:12px;
  align-items:center;
  position:relative;
}

.login-btn{
  padding:10px 24px;
  border:2px solid #e2e8f0;
  background:white;
  color:#0f172a;
  border-radius:25px;
  cursor:pointer;
  font-weight:600;
  transition:all 0.3s;
}

.login-btn:hover{
  border-color:#2563eb;
  color:#2563eb;
}

.sell-btn{
  padding:10px 24px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);
  color:white;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 4px 12px rgba(37,99,235,0.3);
}

.cart-btn{
  padding:10px 18px;
  border:none;
  border-radius:25px;
  background:#f1f5f9;
  cursor:pointer;
  font-weight:600;
}

.cart-btn:hover{
  background:#e2e8f0;
}

/* CART */
.cart-dropdown{
  position:absolute;
  top:65px;
  right:0;
  width:340px;
  max-height:420px;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,0.12);
  padding:15px;
  display:none;
  z-index:9999;
}

.cart-dropdown.active{
  display:block;
}

.cart-dropdown h3{
  margin-bottom:12px;
  font-size:1.1rem;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
  margin-bottom:10px;
  position:relative;
}

.cart-item:hover{
  background:#f8fafc;
}

.cart-item img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:10px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  font-size:0.95rem;
  margin-bottom:4px;
}

.cart-item-info p{
  font-size:0.85rem;
  color:#64748b;
}

.remove-cart{
  position:absolute;
  top:8px;
  right:8px;
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:#fee2e2;
  color:#dc2626;
  cursor:pointer;
  font-size:12px;
}

.empty-cart{
  text-align:center;
  color:#64748b;
  padding:20px 0;
}

/* ================= PAGE ================= */
.main-title{
  text-align:center;
  margin:40px 0;
  font-size:36px;
}

.products{
  width:90%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
  padding-bottom:60px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
}

.card-content{
  padding:15px;
}

.card-content h3{
  margin-bottom:6px;
}

.price{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  font-weight:700;
}

.sale{
  color:#2575fc;
}

.rent{
  color:#27ae60;
}

.btn-row{
  display:flex;
  gap:10px;
}

.btn,.cart-add-btn{
  flex:1;
  text-align:center;
  padding:10px 14px;
  border:none;
  border-radius:20px;
  text-decoration:none;
  font-size:14px;
  cursor:pointer;
  font-weight:600;
}

.btn{
  background:#2575fc;
  color:white;
}

.btn:hover{
  background:#1a5ed8;
}

.cart-add-btn{
  background:#0f172a;
  color:white;
}

.cart-add-btn:hover{
  background:#2563eb;
}
</style>
</head>

<body>

<header>
  <a href="home_page.html" class="logo">UNISWAP</a>

  <div class="nav-links">
    <a href="home_page.html">Home</a>
    <a href="category.html">Categories</a>
    <a href="contact.html">Contact Us</a>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Search premium items...">
    <button><i class="fas fa-search"></i></button>
  </div>

  <div class="nav-right">
    <a href="login.html"><button class="login-btn">Sign In</button></a>
    <a href="add.html"><button class="sell-btn"><i class="fas fa-plus"></i> Post Item</button></a>

    <button class="cart-btn" onclick="toggleCart(event)">
      <i class="fas fa-shopping-cart"></i>
      Cart (<span id="cart-count">0</span>)
    </button>

    <div class="cart-dropdown" id="cart-dropdown">
      <h3>Your Cart</h3>
      <div id="cart-items"></div>
    </div>
  </div>
</header>

<h1 class="main-title">FOOTWEAR COLLECTION</h1>

<div class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800">
    <div class="card-content">
      <h3>Stylish Heels</h3>
      <div class="price">
        <span class="sale">₹899</span>
        <span class="rent">₹199</span>
      </div>
      <div class="btn-row">
        <a href="styling_heels.html" class="btn">View Item</a>
        <button class="cart-add-btn" onclick="addToCart('Stylish Heels','₹899','https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800','styling_heels.html')">Add</button>
      </div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=800">
    <div class="card-content">
      <h3>Comfort Sandals</h3>
      <div class="price">
        <span class="sale">₹699</span>
        <span class="rent">₹149</span>
      </div>
      <div class="btn-row">
        <a href="comfort_sandles.html" class="btn">View Item</a>
        <button class="cart-add-btn" onclick="addToCart('Comfort Sandals','₹699','https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=800','comfort_sandles.html')">Add</button>
      </div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=800">
    <div class="card-content">
      <h3>Leather Boots</h3>
      <div class="price">
        <span class="sale">₹1999</span>
        <span class="rent">₹499</span>
      </div>
      <div class="btn-row">
        <a href="leather_boots.html" class="btn">View Item</a>
        <button class="cart-add-btn" onclick="addToCart('Leather Boots','₹1999','https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=800','leather_boots.html')">Add</button>
      </div>
    </div>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price, image, link){
  cart.push({ name, price, image, link });
  saveCart();
  updateCartUI();
  alert(name + " added to cart!");
}

function removeFromCart(index, event){
  event.stopPropagation();
  cart.splice(index, 1);
  saveCart();
  updateCartUI();
}

function updateCartUI(){
  document.getElementById("cart-count").innerText = cart.length;
  const cartItems = document.getElementById("cart-items");

  if(cart.length === 0){
    cartItems.innerHTML = `<div class="empty-cart">Your cart is empty</div>`;
    return;
  }

  cartItems.innerHTML = cart.map((item, index) => `
    <div class="cart-item" onclick="window.location.href='${item.link}'">
      <img src="${item.image}">
      <div class="cart-item-info">
        <h4>${item.name}</h4>
        <p>${item.price}</p>
      </div>
      <button class="remove-cart" onclick="removeFromCart(${index}, event)">
        <i class="fas fa-times"></i>
      </button>
    </div>
  `).join('');
}

function toggleCart(event){
  event.stopPropagation();
  document.getElementById("cart-dropdown").classList.toggle("active");
}

document.addEventListener("click", function(e){
  const cartDropdown = document.getElementById("cart-dropdown");
  const cartBtn = document.querySelector(".cart-btn");

  if(!cartDropdown.contains(e.target) && !cartBtn.contains(e.target)){
    cartDropdown.classList.remove("active");
  }
});

updateCartUI();
</script>

<script src="wishlist.js"></script>

    <script src="cursor.js"></script>

    <script src="search.js"></script>
</body>
</html>
