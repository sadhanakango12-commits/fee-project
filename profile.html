<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSwap - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-bubbles"></div>
    <nav class="navbar">
        <h2>UniSwap</h2>
        <a href="index.html">Home</a>
    </nav>
    <div class="container">
        <div class="profile">
            <img src="assets/avatar.jpg" alt="Avatar" class="avatar">
            <h3>User Name</h3>
            <span class="verified">Verified Student</span>
            <h4>Wishlist</h4>
            <div class="wishlist">
                <div class="product-card">Sample Wishlist Item</div>
            </div>
        </div>
        <p class="note">Note: Dynamic profile data requires JS.</p>
    </div>
<script src="wishlist.js"></script>

    <script src="cursor.js"></script>

    <script src="search.js"></script>
</body>
</html>
